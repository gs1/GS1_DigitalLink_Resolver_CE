name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [data_entry_server, web_server]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: resolver_ce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/src/requirements.txt
      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        env:
          PYTHONPATH: src
          TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/resolver_ce
        run: python -m unittest discover -s tests -v
